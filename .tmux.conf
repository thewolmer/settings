# Use 256-color support for better colors/theme compatibility
set -g default-terminal "screen-256color"

# Change prefix from default Ctrl+b → Ctrl+a
set -g prefix C-a
unbind C-b
# Allow sending literal Ctrl+a to apps inside tmux
bind C-a send-prefix

# Start window numbering from 1 instead of 0
set -g base-index 1
# Automatically renumber windows when one is closed
set -g renumber-windows on


# ----- Pane splits -----

# Remove default horizontal split (%)
unbind %
# Split horizontally using "\" (more intuitive visually)
bind-key \\ split-window -h

# Remove default vertical split (")
unbind '"'
# Split vertically using "-"
bind-key - split-window -v


# ----- Config reload -----

# Reload tmux config quickly with prefix + r
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded!"


# ----- Pane resizing (hold key to repeat because of -r) -----

# Resize pane down/up/right/left by 5 cells
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# Toggle pane zoom (maximize/restore)
bind -r m resize-pane -Z


# Enable mouse support (click panes, resize, scroll, select)
set -g mouse on


# ----- TPM (Tmux Plugin Manager) -----

# Load plugin manager
set -g @plugin 'tmux-plugins/tpm'

# List of plugins
# Seamless navigation between vim and tmux panes
set -g @plugin 'christoomey/vim-tmux-navigator'
# Status bar themes pack
set -g @plugin 'jimeh/tmux-themepack'
# Sensible default settings for tmux
set -g @plugin 'tmux-plugins/tmux-sensible'
# Save/restore tmux sessions manually
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Auto-save/auto-restore sessions periodically
set -g @plugin 'tmux-plugins/tmux-continuum'


# ----- Plugin options -----

# Save pane contents when resurrecting sessions
set -g @resurrect-capture-pane-contents 'on'
# Automatically restore last session on startup
set -g @continuum-restore 'on'
# Select themepack theme variant
set -g @themepack 'powerline/default/cyan'


# Initialize TPM (must stay at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
